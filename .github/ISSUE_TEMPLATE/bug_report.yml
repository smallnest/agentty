name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Redact pairing tokens, device secrets, and terminal
        contents before pasting logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `agentty`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentty version
      description: Output of `agentty version`.
      placeholder: "agentty 0.1.0 (commit ...)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (Git Bash/WSL)
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - install script
        - prebuilt archive
        - go install
        - built from source
        - other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Session backend
      options:
        - auto
        - host
        - tmux
        - none
        - not sure
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste `$AGENTTY_HOME/daemon.log` excerpts. Redact secrets.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Non-secret `AGENTTY_*` variables, if relevant.
      render: shell
